name: kr_easy_extension
description: Aplicativo Android nativo do KR Easy Extension.
publish_to: none
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/kr-easy-icon.png
  adaptive_icon_background: '#07110B'
  adaptive_icon_foreground: assets/kr-easy-icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
