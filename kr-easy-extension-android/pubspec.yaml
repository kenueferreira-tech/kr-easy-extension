name: kr_easy_extension
description: Aplicativo Android nativo do KR Easy Extension.
publish_to: none
version: 1.2.3+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.3
  timezone: ^0.11.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: assets/kr-easy-icon.png
  adaptive_icon_background: '#07110B'
  adaptive_icon_foreground: assets/kr-easy-icon.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
