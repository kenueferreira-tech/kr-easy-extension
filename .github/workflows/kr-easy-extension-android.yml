name: KR Easy Extension Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'kr-easy-extension-android/lib/**'
      - 'kr-easy-extension-android/test/**'
      - 'kr-easy-extension-android/pubspec.yaml'
      - 'kr-easy-extension-android/assets/**'
      - 'kr-easy-extension-android/tool/**'
      - '.github/workflows/kr-easy-extension-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kr-easy-extension-android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        shell: bash
        run: |
          cp pubspec.yaml /tmp/kr-pubspec.yaml
          cp -R lib /tmp/kr-lib
          cp -R test /tmp/kr-test
          flutter create --platforms=android --org com.kenueferreira --project-name kr_easy_extension --overwrite .
          cp /tmp/kr-pubspec.yaml pubspec.yaml
          cp -R /tmp/kr-lib/. lib/
          python3 -c "from pathlib import Path; Path('test/widget_test.dart').unlink(missing_ok=True)"
          cp -R /tmp/kr-test/. test/
          python3 tool/prepare_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Generate KR Easy launcher icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Unit tests
        run: flutter test --no-pub
      - name: Build private test APK
        run: flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: KR-Easy-Extension-Android-test-APK
          path: kr-easy-extension-android/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
