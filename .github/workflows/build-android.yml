name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches: [main, feature/google-play-purchase]
    paths:
      - "android-app-source.zip"
      - "android-app/twa-manifest.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preserve Bubblewrap manifest
        run: cp android-app/twa-manifest.json /tmp/kr-easy-twa-manifest.json

      - name: Restore Android project
        run: unzip -qo android-app-source.zip -d android-app

      - name: Restore current Bubblewrap manifest
        run: cp /tmp/kr-easy-twa-manifest.json android-app/twa-manifest.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Bubblewrap toolchain
        working-directory: android-app
        run: npx --yes @bubblewrap/cli updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Regenerate TWA with Play Billing
        working-directory: android-app
        run: npx --yes @bubblewrap/cli update --appVersionName=1.2.0

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android-app/kr-easy-upload.keystore

      - name: Build signed bundle
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android-app/kr-easy-upload.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: KR-Easy-Extension-v1.2.0-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
