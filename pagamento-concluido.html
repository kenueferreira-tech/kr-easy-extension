<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110d">
  <title>Pagamento — KR Easy Extension</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050b08;color:#f2fff7;font-family:Inter,system-ui,sans-serif}.card{width:min(580px,100%);padding:34px;border:1px solid #1f3b2d;border-radius:24px;background:#0b1510;text-align:center;box-shadow:0 24px 80px #0008}.logo{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 22px;border-radius:15px;background:linear-gradient(135deg,#65ff9c,#25d366);color:#031008;font-weight:900}h1{margin:0 0 12px;font-size:clamp(1.8rem,6vw,2.7rem)}p{color:#9db7a8;line-height:1.6}.license{display:none;margin:24px 0;padding:18px;border:1px dashed #65ff9c;border-radius:14px;background:#07100b;color:#65ff9c;font:700 clamp(1rem,5vw,1.35rem) ui-monospace,monospace;word-break:break-all}.button{display:inline-flex;justify-content:center;width:100%;min-height:52px;margin-top:10px;align-items:center;border:0;border-radius:14px;background:linear-gradient(135deg,#65ff9c,#25d366);color:#031008;font-weight:850;text-decoration:none;cursor:pointer}.button.secondary{border:1px solid #1f3b2d;background:#101e17;color:#f2fff7}.error{color:#ff9c9c}.hint{font-size:.82rem}.actions{display:none}.actions.open{display:block}
  </style>
</head>
<body><main class="card"><span class="logo">KR</span><h1 id="title">Confirmando seu pagamento…</h1><p id="message">Aguarde enquanto consultamos a InfinitePay.</p><div class="license" id="license"></div><button class="button" id="copy" hidden>Copiar chave de licença</button><div class="actions" id="actions"><button class="button" id="mobile" type="button">Começar a usar no celular</button><a class="button secondary" href="https://github.com/kenueferreira-tech/kr-easy-extension/raw/main/KR-Easy-Extension-v1.0.0.zip">Baixar para o computador</a><a class="button secondary" href="/acesso.html">Abrir área de acesso</a></div><p class="hint" id="hint"></p><a class="button secondary" id="back" href="/" hidden>Voltar ao site</a></main>
<script>
  (async()=>{const params=new URLSearchParams(location.search);const payload={receipt_url:params.get('receipt_url'),order_nsu:params.get('order_nsu'),slug:params.get('slug'),capture_method:params.get('capture_method'),transaction_nsu:params.get('transaction_nsu')};const title=document.querySelector('#title'),message=document.querySelector('#message'),license=document.querySelector('#license'),copy=document.querySelector('#copy'),actions=document.querySelector('#actions'),mobile=document.querySelector('#mobile'),hint=document.querySelector('#hint'),back=document.querySelector('#back');try{const response=await fetch('/api/payment-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||!result.paid)throw new Error(result.error||'Pagamento ainda não confirmado.');title.textContent='Pagamento confirmado!';message.textContent='Sua licença vitalícia está pronta. Guarde esta chave em local seguro.';license.textContent=result.license;license.style.display='block';copy.hidden=false;actions.classList.add('open');copy.onclick=async()=>{await navigator.clipboard.writeText(result.license);copy.textContent='Chave copiada ✓'};mobile.onclick=async()=>{try{await navigator.clipboard.writeText(result.license)}catch{}location.href='/mobile.html'};hint.textContent='Use esta mesma chave no computador e na versão mobile.'}catch(error){title.textContent='Confirmação pendente';message.textContent=error.message;message.className='error';hint.textContent='Se você acabou de pagar, aguarde alguns segundos e recarregue esta página.';back.hidden=false}})();
</script></body></html>
