<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KR Easy — Gerador administrativo de licenças</title>
  <style>body{margin:0;padding:24px;background:#06100a;color:#effff5;font-family:Inter,system-ui,sans-serif}main{max-width:680px;margin:auto}section{padding:24px;border:1px solid #20402d;border-radius:20px;background:#0d1a12}h1{margin-top:0}p{color:#9fb9a8}label{display:block;margin:15px 0 6px;color:#b7cbbd;font-size:12px;font-weight:800}input,select,textarea,button{width:100%;box-sizing:border-box;padding:13px;border-radius:11px;font:inherit}input,select,textarea{border:1px solid #294b36;background:#07110b;color:white}textarea{min-height:190px;margin-top:16px}button{margin-top:16px;border:0;background:linear-gradient(135deg,#69ff9f,#25d366);color:#04200d;font-weight:900;cursor:pointer}.secondary{border:1px solid #294b36;background:#102016;color:white}.note{padding:12px;border-radius:10px;background:#13261a;font-size:12px}</style>
</head>
<body><main><section><h1>Gerador de licenças KR Easy</h1><p>Esta ferramenta funciona localmente. Ela gera uma chave para o cliente e o registro com hash que será cadastrado no Firebase.</p><label for="prefix">Prefixo</label><input id="prefix" value="KREASY" maxlength="12"><label for="plan">Plano</label><select id="plan"><option value="vitalicio">Vitalício</option><option value="anual">Anual</option><option value="mensal">Mensal</option></select><button id="generate" type="button">Gerar nova licença</button><div id="result" hidden><label for="plainKey">Chave para entregar ao cliente</label><input id="plainKey" readonly><button class="secondary" id="copyKey" type="button">Copiar chave</button><label for="firebaseJson">Registro para cadastrar em licenses</label><textarea id="firebaseJson" readonly></textarea><button class="secondary" id="copyJson" type="button">Copiar registro JSON</button><p class="note">O nome do nó no Firebase é o valor de <b>licenseHash</b>. Cadastre dentro dele os campos exibidos em <b>record</b>.</p></div></section></main><script>(()=>{'use strict';const $=s=>document.querySelector(s);const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function block(n){const bytes=crypto.getRandomValues(new Uint8Array(n));return [...bytes].map(v=>alphabet[v%alphabet.length]).join('')}async function hash(value){const data=new TextEncoder().encode(value);const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}async function copy(value){await navigator.clipboard.writeText(value)}$('#generate').onclick=async()=>{const prefix=$('#prefix').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'')||'KREASY';const key=`${prefix}-${block(4)}-${block(4)}-${block(4)}`;const licenseHash=await hash(key);const payload={licenseHash,record:{status:'ativa',plan:$('#plan').value,createdAt:new Date().toISOString(),expiresAt:null}};$('#plainKey').value=key;$('#firebaseJson').value=JSON.stringify(payload,null,2);$('#result').hidden=false};$('#copyKey').onclick=()=>copy($('#plainKey').value);$('#copyJson').onclick=()=>copy($('#firebaseJson').value)})();</script></body>
</html>
