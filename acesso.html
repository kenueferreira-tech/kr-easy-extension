<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07110d">
  <meta name="description" content="Valide sua licença e acesse a KR Easy Extension no celular ou computador.">
  <title>Acessar — KR Easy Extension</title>
  <style>
    :root{--bg:#050b08;--surface:#0b1510;--line:#1f3b2d;--text:#f2fff7;--muted:#9db7a8;--green:#25d366;--neon:#65ff9c;--danger:#ff9c9c}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(circle at 70% 10%,#25d36622,transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center}.shell{width:min(620px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:24px;color:inherit;text-decoration:none;font-weight:900}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--neon),var(--green));color:#031008}.card{padding:clamp(24px,6vw,42px);border:1px solid var(--line);border-radius:26px;background:var(--surface);box-shadow:0 24px 80px #0008}h1{margin:0 0 12px;font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;text-align:center}p{margin:0 0 24px;color:var(--muted);line-height:1.6;text-align:center}.field span{display:block;margin-bottom:8px;font-weight:750}.field input{width:100%;min-height:58px;padding:0 16px;border:1px solid #315440;border-radius:14px;background:#07100b;color:var(--text);font:700 1rem ui-monospace,monospace;text-transform:uppercase;outline:none}.field input:focus{border-color:var(--neon);box-shadow:0 0 0 3px #65ff9c22}.button{display:flex;justify-content:center;align-items:center;width:100%;min-height:54px;margin-top:12px;padding:0 18px;border:1px solid transparent;border-radius:14px;background:linear-gradient(135deg,var(--neon),var(--green));color:#031008;font:inherit;font-weight:850;text-decoration:none;cursor:pointer}.button.secondary{border-color:var(--line);background:#101e17;color:var(--text)}.button:disabled{opacity:.65;cursor:wait}.error{min-height:24px;margin:12px 0 0;color:var(--danger);font-size:.9rem}.success{display:none;text-align:center}.success.open{display:block}.form.hidden{display:none}.check{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:#25d36622;color:var(--neon);font-size:2rem}.license-ok{margin:18px 0;padding:12px;border-radius:12px;background:#07100b;color:var(--neon);font:700 .95rem ui-monospace,monospace}.note{margin:18px 0 0;font-size:.8rem}.back{display:block;margin-top:18px;color:var(--muted);text-align:center;text-decoration:none}
  </style>
</head>
<body><main class="shell"><a class="brand" href="/"><span class="logo">KR</span><span>Easy Extension</span></a><section class="card"><div class="form" id="formView"><h1>Já tenho uma licença</h1><p>Digite sua chave vitalícia para acessar a ferramenta no celular ou instalar a extensão no computador.</p><form id="licenseForm"><label class="field"><span>Chave de licença</span><input id="licenseKey" maxlength="80" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KREASY-XXXX-XXXX-XXXX" required></label><button class="button" id="validateButton" type="submit">Validar minha licença</button><div class="error" id="error" role="alert"></div></form></div><div class="success" id="successView"><span class="check">✓</span><h1>Licença confirmada</h1><p>Escolha onde deseja usar a KR Easy Extension.</p><div class="license-ok" id="maskedLicense"></div><button class="button device-mobile" id="mobileButton" type="button">Abrir aplicativo no celular</button><a class="button secondary device-desktop" href="https://github.com/kenueferreira-tech/kr-easy-extension/raw/main/KR-Easy-Extension-v1.0.0.zip">Baixar extensão para computador</a><button class="button secondary device-mobile" id="desktopShare" type="button">Usar também no computador</button><button class="button secondary device-desktop" id="mobileShare" type="button">Usar também no celular</button><p class="note" id="deviceNote"></p></div></section><a class="back" href="/">← Voltar ao site</a></main>
<script>
(()=>{'use strict';const FIREBASE_DATABASE_URL='https://kr-easy-extension-default-rtdb.firebaseio.com';const $=selector=>document.querySelector(selector);const isMobile=/android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);let activeKey='';document.querySelectorAll(isMobile?'.device-desktop':'.device-mobile').forEach(element=>element.style.display='none');$('#deviceNote').textContent=isMobile?'Sua chave será copiada antes de abrir o aplicativo.':'Descompacte o arquivo e carregue a pasta em chrome://extensions usando o Modo do desenvolvedor.';const normalize=value=>value.trim().toUpperCase().replace(/\s+/g,'');async function hash(key){const bytes=new TextEncoder().encode(key);const digest=await crypto.subtle.digest('SHA-256',bytes);return[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,'0')).join('')}async function validate(key){const licenseHash=await hash(key);const response=await fetch(`${FIREBASE_DATABASE_URL}/licenses/${licenseHash}.json`,{cache:'no-store'});if(!response.ok)throw new Error('Não foi possível consultar sua licença.');const record=await response.json();return record&&(record.status==='ativa'||record.active===true)&&(!record.expiresAt||Date.now()<=new Date(record.expiresAt).getTime())}async function copyKey(){try{await navigator.clipboard.writeText(activeKey)}catch{}}$('#licenseForm').addEventListener('submit',async event=>{event.preventDefault();const button=$('#validateButton'),error=$('#error');activeKey=normalize($('#licenseKey').value);if(activeKey.length<8){error.textContent='Confira a chave informada.';return}button.disabled=true;button.textContent='Validando…';error.textContent='';try{if(!await validate(activeKey))throw new Error('Chave inválida, inativa ou não encontrada.');$('#maskedLicense').textContent=`Licença •••• ${activeKey.slice(-4)}`;$('#formView').classList.add('hidden');$('#successView').classList.add('open')}catch(failure){error.textContent=failure.message}finally{button.disabled=false;button.textContent='Validar minha licença'}});$('#mobileButton').addEventListener('click',async()=>{await copyKey();location.href='/mobile.html'});$('#desktopShare').addEventListener('click',async()=>{await copyKey();if(navigator.share)await navigator.share({title:'KR Easy Extension',text:'Use a licença KR Easy também no computador:',url:location.origin+'/acesso.html'});else{await navigator.clipboard.writeText(location.origin+'/acesso.html');alert('Link para computador copiado.')}});$('#mobileShare').addEventListener('click',()=>{const url=location.origin+'/acesso.html';if(navigator.share)navigator.share({title:'KR Easy Extension',url});else navigator.clipboard.writeText(url).then(()=>alert('Link para celular copiado.'))});})();
</script></body></html>
